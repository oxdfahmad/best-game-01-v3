<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORRERY — Light the Nine Dials</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a1e; }
  #orrery { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="orrery" width="1280" height="720" aria-label="ORRERY: rotate the mirrors to bend starlight onto the nine sundials before dawn"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/orrery-main.js"></script>
</body>
</html>
